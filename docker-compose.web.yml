services:
  web:
    # Stable release!
    image: nginx:1.30.7
    container_name: nginx_web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Static html page goes in here
      - ./html:/usr/share/nginx/html:ro
      # Mount folder for SSL certificates
      - ${CERTIFICATE_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
      # HTTPS is enabled once the certificate is available.
      - ./nginx/odnsapi.http.conf:/etc/nginx/conf.d/odnsapi-http.conf:ro
      - ./nginx/odnsapi.prod.conf:/etc/nginx/odnsapi.prod.conf:ro
      - ./nginx/40-enable-https.sh:/docker-entrypoint.d/40-enable-https.sh:ro
      # Internal-only dataset downloads.
      - odns_data:/data:ro
      # Persist nginx logs so Telegraf can analyze the complete mounted log files
      - ./logs/nginx:/var/log/nginx
    restart: always
    depends_on:
      - dotnet_app
    networks:
      - frontend_network
      - odnsapi_network
      - postgresdb_network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      retries: 3
      start_period: 10s
    develop:
      watch:
        - path: ./html
          action: restart 
        - path: ./nginx
          action: restart

  certbot:
    image: certbot/certbot:v5.10.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/renew-certificates.sh"]
    environment:
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-}
    volumes:
      - ${CERTIFICATE_DIR:-/etc/letsencrypt}:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
      - ./nginx/renew-certificates.sh:/usr/local/bin/renew-certificates.sh:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - frontend_network

volumes:
  certbot_webroot:
