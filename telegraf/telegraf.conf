[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 500
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "5s"
  flush_jitter = "0s"
  precision = ""
  hostname = "telegraf"
  omit_hostname = false

debug = false

[[inputs.opentelemetry]]
  #grpc_endpoint = "0.0.0.0:4317"
  #http_endpoint = "0.0.0.0:4318"
  #data_format = "protobuf"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  #token = "qQSxYVkbbkHW4GRSy4Q39R54Hnl6QSqrTBx6a976-Z2fMM3dtTcA__u297YUS6iZnvPyCI7NWil7gwuAeGi0LQ=="
  token= "my-secret-token"
  organization = "my-org"
  bucket = "my-bucket"

[[inputs.postgresql_extensible]]
  address = "host=postgres_db user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} sslmode=disable"

  [[inputs.postgresql_extensible.query]]
    measurement = "odns_db"
    withdbname = false
    tagvalue = ""
    sqlquery = """
      SELECT
        COUNT(*)::bigint AS total_api_keys,
        COUNT(*) FILTER (WHERE is_active = TRUE)::bigint AS active_api_keys,
        COUNT(*) FILTER (WHERE is_active = TRUE AND is_processed = FALSE)::bigint AS unprocessed_active_api_keys,
        COALESCE((SELECT MAX(scan_date) FROM odns.dns_entries), DATE '1970-01-01')::text AS latest_scan_date,
        EXTRACT(EPOCH FROM COALESCE((SELECT MAX(scan_date) FROM odns.dns_entries), DATE '1970-01-01')::timestamp)::bigint AS latest_scan_date_unix,
        (CURRENT_DATE - COALESCE((SELECT MAX(scan_date) FROM odns.dns_entries), DATE '1970-01-01'))::bigint AS latest_scan_age_days
      FROM odns.api_keys;
    """

[[inputs.tail]]
  files = ["/var/log/nginx/access.log", "/var/log/nginx/access.log.*"]
  from_beginning = true
  watch_method = "inotify"
  data_format = "json_v2"

  [[inputs.tail.json_v2]]
    measurement_name = "nginx_access"
    timestamp_path = "time"
    timestamp_format = "2006-01-02T15:04:05-07:00"

    [[inputs.tail.json_v2.tag]]
      path = "method"
      rename = "method"
    [[inputs.tail.json_v2.tag]]
      path = "host"
      rename = "host"
    [[inputs.tail.json_v2.tag]]
      path = "uri"
      rename = "uri"
    [[inputs.tail.json_v2.tag]]
      path = "status"
      rename = "status"
    [[inputs.tail.json_v2.tag]]
      path = "upstream_status"
      rename = "upstream_status"

    [[inputs.tail.json_v2.field]]
      path = "status_code"
      rename = "status_code"
      type = "int"
    [[inputs.tail.json_v2.field]]
      path = "request_time"
      rename = "request_time"
      type = "float"
    [[inputs.tail.json_v2.field]]
      path = "body_bytes_sent"
      rename = "body_bytes_sent"
      type = "int"
    [[inputs.tail.json_v2.field]]
      path = "request_length"
      rename = "request_length"
      type = "int"
